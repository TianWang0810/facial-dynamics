name: talkvid
# HPC (linux-64) source specification for env-v0.1.
#
# This is the file conda-lock consumes to produce conda-lock.yml.
# It lists only TOP-LEVEL dependencies (what we actually asked for), pinned to
# the versions currently running on the AICR cluster. Transitive dependencies
# are resolved by conda-lock and recorded with exact builds in conda-lock.yml.
#
# linux-64 is the only locked platform. macOS is prototyping-only and is
# deliberately not tracked here. See NOTES.md.
channels:
  - conda-forge
platforms:
  - linux-64
dependencies:
  - python=3.10
  # No <7 cap on Linux -- see NOTES.md "ffmpeg Version Constraint Is
  # Platform-Dependent". 9.0.1 is the build validated on HPC.
  - ffmpeg==9.0.1
  - pip
  - pip:
      # Ingestion / media
      - yt-dlp==2026.8.19
      - av==17.1.0
      # Geometry extraction -- do NOT upgrade to 1.0.x, see NOTES.md
      - mediapipe==0.10.21
      - opencv-python==4.11.0.86
      - opencv-contrib-python==4.11.0.86
      # numpy held at 1.x: mediapipe 0.10.21 is not numpy-2 compatible
      - numpy==1.26.4
      - scipy==1.15.3
      # Tabular output / manifests
      - pandas==2.3.3
      - pyarrow==25.0.1
      # Diagnostics / reporting
      - matplotlib==3.10.9
      - rich==15.0.0
      - sounddevice==0.5.6
